        h1, h2, h3, .font-heading {

        }

        /* Dark cards & buttons with glow and smooth transitions */
        .card-dark {
            background: #0d0f17;
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #9333ea 0%, #6d28d9 100%);
            color: #ffffff;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        @media (min-width: 640px) {
            .btn-primary:hover {
                background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
                transform: translateY(-2px);
                box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
            }
        }

        .btn-dark {
            background: #151824;
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #e5e7eb;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-dark:active {
            transform: scale(0.97);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-fade {
            animation: fadeIn 220ms ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CS:GO Case Opening Mobile Optimized Container */
        .case-opening-container {
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            border-radius: 1.25rem;
            background: #06070a;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 0 20px rgba(139, 92, 246, 0.25);
        }

        .case-opening-strip {
            display: flex;
            will-change: transform;
            transition-property: transform;
            transition-timing-function: cubic-bezier(0.08, 0.8, 0.15, 1);
        }

        .item-card {
            flex-shrink: 0;
            width: 125px;
            height: 140px;
            margin: 0 4px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            position: relative;
            background: #141722;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (min-width: 640px) {
            .item-card {
                width: 145px;
                height: 155px;
                margin: 0 6px;
                border-radius: 14px;
                padding: 10px;
            }

        /* Distinct Item Rarity Backgrounds & Borders */
        .rarity-common {
            border: 1px solid rgba(156, 163, 175, 0.4);
            border-bottom: 5px solid #9ca3af;
            background: linear-gradient(180deg, #181c28 0%, #252b3b 100%);

        .rarity-uncommon {
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-bottom: 5px solid #3b82f6;
            background: linear-gradient(180deg, #141f36 0%, #1d2e54 100%);

        .rarity-rare {

            border: 1px solid rgba(236, 72, 153, 0.5);

                                <Icons.LogoSquare />
                                <div className="leading-tight">
                                    <div className="text-xs sm:text-sm font-extrabold font-heading text-white tracking-wider">GUGUTECH</div>
                                    <div className="text-[9px] text-purple-400 font-semibold tracking-widest uppercase">RANDOM SHOP</div>
                                </div>
                            </div>

                            {/* Menu Actions */}
                            <div className="flex items-center space-x-1.5">
                                <button
                                    onClick={() => setActiveTab('catalog')}
                                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                        activeTab === 'catalog' ? 'bg-purple-600 text-white' : 'text-neutral-400'
                                    }`}
                                >
                                    Catalog
                                </button>
                                <button
                                    onClick={() => setActiveTab('custom')}
                                    className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all ${
                                        activeTab === 'custom' ? 'bg-purple-600 text-white' : 'text-neutral-400'
                                    }`}
                                >
                                    Custom
                                </button>
                                <button
                                    onClick={() => setActiveTab('employment')}
                                    className={`px-2 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 ${
                                        activeTab === 'employment' ? 'bg-amber-500 text-black' : 'text-amber-400'
                                    }`}
                                >
                                    <Icons.Briefcase />
                                    <span className="hidden sm:inline">Angajări</span>
                                </button>

                                <button
                                    onClick={() => setIsCartOpen(true)}
                                    className="relative p-2 btn-dark rounded-lg text-white ml-1 border-purple-500/40"
                                >
                                    <Icons.Cart />
                                    {cart.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-purple-600 text-white font-extrabold text-[9px] h-4 w-4 rounded-full flex items-center justify-center border border-purple-300">
                                            {cart.length}
                                        </span>
                                    )}
                                </button>
                            </div>

                        </div>
                    </header>

                    {}
                    <main className="flex-1 max-w-6xl mx-auto w-full px-3 sm:px-4 py-5 sm:py-8">
                        {activeTab === 'catalog' && (
                            <div className="space-y-6 animate-fade">
                                
                                {/* HERO BANNER */}
                                <div className="card-dark rounded-2xl p-5 sm:p-7 relative overflow-hidden flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-purple-500/40 bg-gradient-to-r from-[#120e24] via-[#1a1236] to-[#0f0c1e]">
                                    <div className="space-y-1.5">
                                        <span className="text-[9px] font-mono uppercase text-purple-400 font-bold bg-purple-950/80 px-2.5 py-0.5 rounded-full border border-purple-500/30 inline-block">PRINTARE 3D BAMBU LAB</span>
                                        <h2 className="text-lg sm:text-2xl font-extrabold font-heading text-white">Ai un model 3D de pe net?</h2>
                                        <p className="text-xs text-neutral-300 max-w-xl">
                                            Trimite link-ul și îl printăm rapid în culorile tale favorite!
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setActiveTab('custom')}
                                        className="btn-primary px-5 py-2.5 rounded-xl font-bold text-xs shrink-0"
                                    >
                                        Comandă Custom →
                                    </button>
                                </div>

                                {/* PRODUCTS CATALOG */}
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-sm sm:text-base font-bold flex items-center space-x-2 font-heading text-white">
                                            <span>Modele Disponibile</span>
                                            <span className="text-xs text-purple-400 font-mono">({CATALOG_PRODUCTS.length})</span>
                                        </h3>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {CATALOG_PRODUCTS.map(product => (
                                            <div key={product.id} className="card-dark rounded-2xl p-3.5 flex flex-col justify-between group">
                                                <div>
                                                    <div className="relative aspect-square rounded-xl bg-neutral-900 overflow-hidden mb-2.5 border border-purple-900/40">
                                                        <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                                                        <span className="absolute top-2 left-2 bg-black/80 backdrop-blur-md text-[9px] font-bold px-2 py-0.5 rounded text-purple-300 border border-purple-500/40">
                                                            {product.category}
                                                        </span>
                                                    </div>

                                                    <h4 className="font-bold text-xs sm:text-sm text-white font-heading">{product.name}</h4>
                                                    <p className="text-[11px] text-neutral-400 mt-1 leading-snug">{product.desc}</p>
                                                </div>

                                                <div className="pt-3 mt-3 border-t border-purple-950/60 flex items-center justify-between">
                                                    <div>
                                                        <span className="text-[9px] text-purple-400 uppercase font-mono block">De la</span>
                                                        <span className="font-bold text-xs sm:text-sm text-white font-heading">{product.basePrice.toFixed(2)} RON</span>
                                                    </div>

                                                    <button
                                                        onClick={() => setSelectedConfigProduct(product)}
                                                        className="btn-dark px-3 py-1.5 rounded-xl font-bold text-xs text-white"
                                                    >
                                                        Configurează
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        )}

                        {activeTab === 'custom' && (
                            <div className="max-w-md mx-auto card-dark rounded-2xl p-5 sm:p-7 space-y-4 animate-fade border border-purple-500/40">
                                <div className="text-center space-y-1">
                                    <h2 className="text-lg font-bold font-heading text-white">Comandă Custom 3D</h2>
                                    <p className="text-xs text-neutral-400">Trimite datele pentru cotație pe WhatsApp.</p>
                                </div>

                                {customSent ? (
                                    <div className="p-4 bg-purple-950/40 border border-purple-500/50 rounded-xl text-center space-y-2">
                                        <div className="text-purple-300 font-bold text-xs">Cerere Trimisă!</div>
                                        <p className="text-[11px] text-neutral-300">Te vom contacta rapid pe WhatsApp.</p>
                                        <button onClick={() => setCustomSent(false)} className="btn-dark px-3 py-1.5 rounded-lg text-xs font-bold">
                                            Trimite alta
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleCustomSubmit} className="space-y-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-neutral-300 mb-1">Nume:</label>
                                            <input
                                                type="text"
                                                required
                                                value={customForm.name}
                                                onChange={e => setCustomForm({...customForm, name: e.target.value})}
                                                placeholder="Nume..."
                                                className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-neutral-300 mb-1">Telefon / Instagram:</label>
                                            <input
                                                type="text"
                                                required
                                                value={customForm.contact}
                                                onChange={e => setCustomForm({...customForm, contact: e.target.value})}
                                                placeholder="07xx xxx xxx sau @user"
                                                className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-neutral-300 mb-1">Descriere model:</label>
                                            <textarea
                                                required
                                                rows="3"
                                                value={customForm.description}
                                                onChange={e => setCustomForm({...customForm, description: e.target.value})}
                                                placeholder="Descrie modelul..."
                                                className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                            ></textarea>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-neutral-300 mb-1">Link fișier (opțional):</label>
                                            <input
                                                type="url"
                                                value={customForm.link}
                                                onChange={e => setCustomForm({...customForm, link: e.target.value})}
                                                placeholder="https://..."
                                                className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            className="w-full btn-primary py-3 rounded-xl font-bold text-xs flex items-center justify-center space-x-1.5"
                                        >
                                            <Icons.Send />
                                            <span>Trimite pe WhatsApp</span>
                                        </button>
                                    </form>
                                )}
                            </div>
                        )}

                        {activeTab === 'employment' && (
                            <div className="max-w-md mx-auto card-dark rounded-2xl p-6 space-y-4 animate-fade border border-amber-500/40">
                                <div className="w-10 h-10 mx-auto rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400">
                                    <Icons.Briefcase />
                                </div>

                                <div className="text-center space-y-1">
                                    <h2 className="text-lg font-extrabold font-heading text-white">Echipa Random Shop 💼</h2>
                                    <p className="text-xs text-neutral-300 leading-relaxed">
                                        Căutăm colegi pentru promovare și organizare comenzi.
                                    </p>
                                </div>

                                <div className="p-3 bg-neutral-900/80 rounded-xl border border-neutral-800 text-xs text-neutral-300 space-y-1.5">
                                    <div className="font-bold text-amber-400">Beneficii:</div>
                                    <ul className="list-disc list-inside space-y-1 text-neutral-300">
                                        <li>Comision per comandă</li>
                                        <li>Acces prioritar la modele noi</li>
                                        <li>Program flexibil</li>
                                    </ul>
                                </div>

                                <a
                                    href={`https://wa.me/40733621627?text=${encodeURIComponent('Salut! Caut job la Random Shop.')}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center space-x-1.5 block text-center"
                                >
                                    <Icons.Send />
                                    <span>Aplică pe WhatsApp →</span>
                                </a>
                            </div>
                        )}
                    </main>

                    {}
                    <div className="fixed bottom-4 left-3 sm:left-6 z-40">
                        <button
                            onClick={() => setShowCaseModal(true)}
                            className="btn-primary px-3.5 py-2.5 sm:px-5 sm:py-3 rounded-xl sm:rounded-2xl shadow-xl flex items-center space-x-2 border border-purple-400/50"
                        >
                            <span className="text-xl sm:text-2xl">🎰</span>
                            <div className="text-left">
                                <div className="text-[8px] sm:text-[10px] uppercase font-extrabold tracking-wider text-purple-200">ROATA NOROCULUI</div>
                                <div className="text-xs sm:text-sm font-extrabold text-white font-heading">Spin & Win</div>
                            </div>
                        </button>
                    </div>

                    {/* CONFIGURATOR MODAL */}
                    {selectedConfigProduct && (
                        <ConfiguratorModal
                            product={selectedConfigProduct}
                            onClose={() => setSelectedConfigProduct(null)}
                            onAddToCart={handleAddToCart}
                        />
                    )}

                    {}
                    <div className={`fixed inset-0 z-50 flex justify-end transition-opacity duration-300 ${isCartOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}>
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                        
                        <div className={`relative w-full max-w-sm bg-[#090b10] border-l border-purple-500/30 h-full shadow-2xl flex flex-col transform transition-transform duration-300 ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                            
                            <div className="p-4 border-b border-purple-900/40 flex justify-between items-center shrink-0">
                                <h3 className="font-bold text-sm flex items-center space-x-2 font-heading text-white">
                                    <Icons.Cart />
                                    <span>Coșul tău ({cart.length})</span>
                                </h3>
                                <button onClick={() => setIsCartOpen(false)} className="text-neutral-400 hover:text-white">
                                    <Icons.X />
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-4 space-y-2.5 no-scrollbar">
                                {cart.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-neutral-500 text-xs">
                                        <p>Coșul este gol.</p>
                                    </div>
                                ) : (
                                    cart.map(item => (
                                        <div key={item.id} className="p-3 rounded-xl bg-neutral-900 border border-purple-900/40 flex justify-between items-start">
                                            <div>
                                                <h4 className="font-bold text-xs text-white font-heading">{item.productName}</h4>
                                                <p className="text-[10px] text-neutral-400 mt-0.5">Opt: {item.subVariant}</p>
                                                <p className="text-[10px] text-neutral-400">Cul: {item.color.name}</p>
                                                {item.isAms && <p className="text-[9px] text-purple-400 font-semibold">MultiColor AMS</p>}
                                                <button
                                                    onClick={() => removeFromCart(item.id)}
                                                    className="text-[11px] text-red-400 hover:text-red-300 mt-1.5 flex items-center space-x-1"
                                                >
                                                    <Icons.Trash />
                                                    <span>Șterge</span>
                                                </button>
                                            </div>
                                            <div className="font-bold text-xs text-white font-heading">{item.price.toFixed(2)} RON</div>
                                        </div>
                                    ))
                                )}

                                {cart.length > 0 && (
                                    <div className="pt-3 border-t border-purple-900/40 space-y-2">
                                        <label className="text-[10px] font-bold text-purple-300 block">Cod Promoțional:</label>
                                        <div className="flex space-x-1.5">
                                            <input
                                                type="text"
                                                value={promoInput}
                                                onChange={e => setPromoInput(e.target.value)}
                                                placeholder="ex. GRUIA10"
                                                className="bg-neutral-900 border border-purple-900/50 rounded-xl px-2.5 py-1.5 text-xs text-white uppercase focus:outline-none flex-1"
                                            />
                                            <button
                                                onClick={applyPromoCode}
                                                className="btn-dark px-3 py-1.5 rounded-xl text-xs font-bold"
                                            >
                                                Aplică
                                            </button>
                                        </div>
                                        {promoError && <p className="text-[10px] text-red-400 font-semibold">{promoError}</p>}
                                        {promoSuccess && <p className="text-[10px] text-emerald-400 font-semibold">{promoSuccess}</p>}
                                    </div>
                                )}
                            </div>

                            {cart.length > 0 && (
                                <div className="p-4 border-t border-purple-900/40 bg-neutral-950 space-y-2.5 shrink-0">
                                    {appliedDiscount > 0 && (
                                        <div className="flex justify-between items-center text-xs text-emerald-400 font-bold bg-emerald-950/30 p-2 rounded-lg border border-emerald-800/40">
                                            <span>Reducere:</span>
                                            <span>-{appliedDiscount}%</span>
                                        </div>
                                    )}

                                    <div className="flex justify-between items-center font-bold text-sm font-heading text-white">
                                        <span>Total:</span>
                                        <span>{totalCartPrice.toFixed(2)} RON</span>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setIsCartOpen(false);
                                            setIsCheckoutOpen(true);
                                        }}
                                        className="w-full btn-primary py-3 rounded-xl font-bold text-xs"
                                    >
                                        Finalizează Comanda →
                                    </button>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* CHECKOUT MODAL */}
                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 animate-fade">
                            <div className="max-w-sm w-full card-dark rounded-2xl p-5 relative overflow-hidden flex flex-col max-h-[85vh] border border-purple-500/40">
                                
                                <div className="flex justify-between items-center pb-2.5 border-b border-purple-900/40 shrink-0">
                                    <h3 className="font-bold text-sm font-heading text-white">Date Livrare</h3>
                                    <button onClick={() => setIsCheckoutOpen(false)} className="text-neutral-400 hover:text-white">
                                        <Icons.X />
                                    </button>
                                </div>

                                <form onSubmit={handleOrderSubmit} className="flex-1 overflow-y-auto py-3 space-y-3 no-scrollbar">
                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Nume Complet:</label>
                                        <input
                                            type="text"
                                            required
                                            value={checkoutForm.name}
                                            onChange={e => setCheckoutForm({...checkoutForm, name: e.target.value})}
                                            placeholder="Nume..."
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Telefon:</label>
                                        <input
                                            type="tel"
                                            required
                                            value={checkoutForm.phone}
                                            onChange={e => setCheckoutForm({...checkoutForm, phone: e.target.value})}
                                            placeholder="07xx xxx xxx"
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Metodă Predare:</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setCheckoutForm({...checkoutForm, deliveryType: 'school'})}
                                                className={`p-2.5 rounded-xl border text-[11px] text-center ${checkoutForm.deliveryType === 'school' ? 'border-purple-500 bg-purple-950/40 text-white font-bold' : 'border-neutral-800 text-neutral-400'}`}
                                            >
                                                Preluare Școală
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setCheckoutForm({...checkoutForm, deliveryType: 'home'})}
                                                className={`p-2.5 rounded-xl border text-[11px] text-center ${checkoutForm.deliveryType === 'home' ? 'border-purple-500 bg-purple-950/40 text-white font-bold' : 'border-neutral-800 text-neutral-400'}`}
                                            >
                                                Adresă (&lt;2KM)
                                            </button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">
                                            {checkoutForm.deliveryType === 'school' ? 'Clasă / Loc întâlnire:' : 'Adresă completă:'}
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            value={checkoutForm.locationDetails}
                                            onChange={e => setCheckoutForm({...checkoutForm, locationDetails: e.target.value})}
                                            placeholder={checkoutForm.deliveryType === 'school' ? 'ex. Clasa X-B' : 'Adresă sub 2km...'}
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full btn-primary py-3 rounded-xl font-bold text-xs mt-2 shrink-0"
                                    >
                                        Comandă WhatsApp ({totalCartPrice.toFixed(2)} RON)
                                    </button>
                                </form>

                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
