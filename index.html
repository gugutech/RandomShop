<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANDOM SHOP</title>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Premium Google Fonts: Space Grotesk & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #06070a;
            color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
        }

        h1, h2, h3, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Dark cards & buttons with glow and smooth transitions */
        .card-dark {
            background: #0d0f17;
            border: 1px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(139, 92, 246, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #9333ea 0%, #6d28d9 100%);
            color: #ffffff;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
        }

        .btn-dark {
            background: #151824;
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #e5e7eb;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-dark:hover {
            background: #1f2436;
            border-color: rgba(168, 85, 247, 0.6);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Smooth UI motion */
        .animate-fade {
            animation: fade-in 260ms ease-out both;
        }

        .page-enter {
            animation: page-enter 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .modal-backdrop-enter {
            animation: backdrop-enter 220ms ease-out both;
        }

        .modal-panel-enter {
            animation: modal-panel-enter 300ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .step-enter {
            animation: step-enter 280ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .step-fade-out {
            animation: step-fade-out 180ms ease-in both;
        }

        .discount-swap {
            animation: discount-swap 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-pulse-glow {
            animation: pulse-glow 1.8s ease-in-out infinite;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes page-enter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes backdrop-enter {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modal-panel-enter {
            from { opacity: 0; transform: translateY(14px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes step-enter {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes step-fade-out {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-10px); }
        }

        @keyframes discount-swap {
            from { opacity: 0; transform: translateY(6px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 rgba(168, 85, 247, 0); }
            50% { box-shadow: 0 0 26px rgba(168, 85, 247, 0.38); }
        }


        .step-splash {
            position: absolute;
            inset: 0;
            z-index: 60;
            background:
                radial-gradient(circle at 50% 45%, rgba(139, 92, 246, 0.13), transparent 42%),
                #08090c;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            animation: step-splash-in 260ms ease-out both;
        }

        .step-splash-content {
            text-align: center;
            animation: step-splash-content 920ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .step-splash-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.65rem, 4vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: white;
        }

        .hover-purple {
            transition: box-shadow 220ms ease, border-color 220ms ease, background-color 220ms ease, transform 220ms ease;
        }

        .hover-purple:hover {
            box-shadow: inset 0 0 45px rgba(168, 85, 247, 0.08), 0 0 22px rgba(139, 92, 246, 0.12);
        }

        .purple-corner-glow {
            position: relative;
            isolation: isolate;
        }

        .purple-corner-glow::before,
        .purple-corner-glow::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 180px;
            border-radius: 999px;
            filter: blur(50px);
            pointer-events: none;
            opacity: 0.16;
            z-index: -1;
        }

        .purple-corner-glow::before {
            top: -100px;
            left: -80px;
            background: #8b5cf6;
        }

        .purple-corner-glow::after {
            right: -100px;
            bottom: -110px;
            background: #a855f7;
        }

        @keyframes step-splash-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes step-splash-content {
            0% { opacity: 0; transform: scale(0.94) translateY(8px); }
            30% { opacity: 1; transform: scale(1) translateY(0); }
            70% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1.02) translateY(-5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 1ms !important;
            }
        }


        .case-opening-container {
            position: relative; overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.5);
            border-radius: 1.25rem; background: #06070a;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.95), 0 0 25px rgba(139, 92, 246, 0.25);
        }
        .case-opening-strip {
            display: flex; will-change: transform;
            transition-property: transform;
            transition-timing-function: cubic-bezier(0.08, 0.8, 0.15, 1);
        }
        .item-card {
            flex-shrink: 0; width: 145px; height: 155px; margin: 0 6px;
            border-radius: 14px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 10px; position: relative; background: #141722;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .rarity-common { border: 1px solid rgba(156,163,175,.4); border-bottom: 5px solid #9ca3af; background: linear-gradient(180deg,#181c28 0%,#252b3b 100%); }
        .rarity-uncommon { border: 1px solid rgba(59,130,246,.4); border-bottom: 5px solid #3b82f6; background: linear-gradient(180deg,#141f36 0%,#1d2e54 100%); box-shadow: inset 0 0 10px rgba(59,130,246,.15); }
        .rarity-rare { border: 1px solid rgba(168,85,247,.5); border-bottom: 5px solid #a855f7; background: linear-gradient(180deg,#221436 0%,#3a1d5a 100%); box-shadow: inset 0 0 12px rgba(168,85,247,.2); }
        .rarity-classified { border: 1px solid rgba(236,72,153,.5); border-bottom: 5px solid #ec4899; background: linear-gradient(180deg,#331429 0%,#581d43 100%); box-shadow: inset 0 0 15px rgba(236,72,153,.25); }
        .rarity-covert { border: 1px solid rgba(239,68,68,.6); border-bottom: 5px solid #ef4444; background: linear-gradient(180deg,#381414 0%,#611e1e 100%); box-shadow: inset 0 0 18px rgba(239,68,68,.3); }
        .rarity-gold { border: 1px solid rgba(234,179,8,.8); border-bottom: 5px solid #eab308; background: linear-gradient(180deg,#3a2e0e 0%,#685213 100%); box-shadow: 0 0 20px rgba(234,179,8,.3), inset 0 0 20px rgba(234,179,8,.3); }


        .modal-backdrop-exit { animation: backdrop-exit 200ms ease-in both; }
        .modal-panel-exit { animation: modal-panel-exit 220ms ease-in both; }
        @keyframes backdrop-exit { from { opacity: 1; } to { opacity: 0; } }
        @keyframes modal-panel-exit { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(10px) scale(0.98); } }

    </style>

                                        </div>
                                        {promoError && <p className="text-[10px] text-red-400 font-semibold">{promoError}</p>}
                                        {promoSuccess && <p className="text-[10px] text-emerald-400 font-semibold">{promoSuccess}</p>}
                                    </div>
                                )}
                            </div>

                            {cart.length > 0 && (
                                <div className="p-5 border-t border-purple-900/40 bg-neutral-950 space-y-3">
                                    {appliedDiscount > 0 && (
                                        <div className="flex justify-between items-center text-xs text-emerald-400 font-bold bg-emerald-950/30 p-2.5 rounded-xl border border-emerald-800/40">
                                            <span>Reducere Aplicată:</span>
                                            <span>-{appliedDiscount}%</span>
                                        </div>
                                    )}

                                    <div className="flex justify-between items-center font-bold text-base font-heading text-white">
                                        <span>Total Final:</span>
                                        <span>{totalCartPrice.toFixed(2)} RON</span>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setIsCartOpen(false);
                                            setIsCheckoutOpen(true);
                                        }}
                                        className="w-full btn-primary py-3.5 rounded-xl font-bold text-xs shadow-lg shadow-purple-900/40"
                                    >
                                        Finalizează Comanda →
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* CHECKOUT MODAL */}
                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 modal-backdrop-enter">
                            <div className="max-w-md w-full card-dark rounded-3xl p-6 relative overflow-hidden flex flex-col max-h-[90vh] border border-purple-500/40 modal-panel-enter">
                                <div className="flex justify-between items-center pb-3 border-b border-purple-900/40">
                                    <h3 className="font-bold text-base font-heading text-white">Finalizare Comandă</h3>
                                    <button onClick={() => setIsCheckoutOpen(false)} className="text-neutral-400 hover:text-white">
                                        <Icons.X />
                                    </button>
                                </div>

                                <form onSubmit={handleOrderSubmit} className="flex-1 overflow-y-auto py-4 space-y-4 no-scrollbar">
                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Nume și Prenume:</label>
                                        <input
                                            type="text"
                                            required
                                            value={checkoutForm.name}
                                            onChange={e => setCheckoutForm({...checkoutForm, name: e.target.value})}
                                            placeholder="Nume complet..."
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Număr Telefon:</label>
                                        <input
                                            type="tel"
                                            required
                                            value={checkoutForm.phone}
                                            onChange={e => setCheckoutForm({...checkoutForm, phone: e.target.value})}
                                            placeholder="07xx xxx xxx"
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Email:</label>
                                        <input
                                            type="email"
                                            value={checkoutForm.email}
                                            onChange={e => setCheckoutForm({...checkoutForm, email: e.target.value})}
                                            placeholder="email@exemplu.ro"
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Metodă Predare:</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setCheckoutForm({...checkoutForm, deliveryType: 'school'})}
                                                className={`p-3 rounded-xl border text-xs text-left transition-all ${checkoutForm.deliveryType === 'school' ? 'border-purple-500 bg-purple-950/40 text-white font-bold' : 'border-neutral-800 text-neutral-400'}`}
                                            >
                                                Preluare Școală (Gratis)
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setCheckoutForm({...checkoutForm, deliveryType: 'home'})}
                                                className={`p-3 rounded-xl border text-xs text-left transition-all ${checkoutForm.deliveryType === 'home' ? 'border-purple-500 bg-purple-950/40 text-white font-bold' : 'border-neutral-800 text-neutral-400'}`}
                                            >
                                                Livrare la Adresă (Max 2KM)
                                            </button>
                                        </div>
                                    </div>

                                    {checkoutForm.deliveryType === 'home' && (
                                        <p className="text-[11px] text-amber-400 bg-amber-950/30 border border-amber-800/40 p-2.5 rounded-xl">
                                            Atenție: Livrarea la adresă este permisă doar pentru o distanță de maxim 2 km față de școală!
                                        </p>
                                    )}

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">
                                            {checkoutForm.deliveryType === 'school' ? 'Clasa / Liceul / Loc de întâlnire:' : 'Adresă completă (sub 2km):'}
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            value={checkoutForm.locationDetails}
                                            onChange={e => setCheckoutForm({...checkoutForm, locationDetails: e.target.value})}
                                            placeholder={checkoutForm.deliveryType === 'school' ? 'ex. Clasa X-B sau la pauza mare' : 'Adresă completă...'}
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-neutral-300 mb-1">Mențiuni (opțional):</label>
                                        <textarea
                                            rows="2"
                                            value={checkoutForm.notes}
                                            onChange={e => setCheckoutForm({...checkoutForm, notes: e.target.value})}
                                            placeholder="Orice detalii suplimentare..."
                                            className="w-full bg-neutral-900 border border-purple-900/50 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500"
                                        ></textarea>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full btn-primary py-3.5 rounded-xl font-bold text-xs mt-2 shadow-lg shadow-purple-900/40"
                                    >
                                        Trimite Comanda pe WhatsApp ({totalCartPrice.toFixed(2)} RON)
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
